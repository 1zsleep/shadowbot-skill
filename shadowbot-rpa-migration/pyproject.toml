[project]
name = "xobt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography",
    "pyside6",
    "requests",
]

[dependency-groups]
dev = [
    "pyinstaller",
    "pytest",
    "pytest-qt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
